custom_guidelines:
  general:
    - name: "Python type rules guideline"
      path: "guidelines/type_rules.txt"
  per_language:
    java:
      name: "Java guideline valid -1 "
      path: "java_guidelines.rtf"
    python:
      name: "Python function rules guideline"
      path: "guidelines/function_rules.txt"
      name: "Python error rules guideline"
      path: "guidelines/error_rules.txt"
